[project]
name = "pawconscious-mesh"
version = "0.1.0"
description = "ACP for Pet — agentic compliance protocol reference deployment"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Omar Dominguez", email = "omar.dominguez7@gmail.com"}]

dependencies = [
    "google-adk>=1.33.0",
    "google-cloud-aiplatform>=1.153.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.14.0",
    "lxml>=5.0.0",
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
