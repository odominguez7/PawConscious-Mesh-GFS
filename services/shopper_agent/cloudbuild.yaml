steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - services/shopper_agent/Dockerfile
      - -t
      - us-central1-docker.pkg.dev/pawconscious-mesh-2026/acp-images/shopper-agent:v0.2.0-poll
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/pawconscious-mesh-2026/acp-images/shopper-agent:v0.2.0-poll
images:
  - us-central1-docker.pkg.dev/pawconscious-mesh-2026/acp-images/shopper-agent:v0.2.0-poll
options:
  logging: CLOUD_LOGGING_ONLY
