steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - services/shopper_agent/Dockerfile
      - -t
      - us-central1-docker.pkg.dev/pawconscious-mesh-2026/acp-images/shopper-agent:v0.1.0
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/pawconscious-mesh-2026/acp-images/shopper-agent:v0.1.0
images:
  - us-central1-docker.pkg.dev/pawconscious-mesh-2026/acp-images/shopper-agent:v0.1.0
options:
  logging: CLOUD_LOGGING_ONLY
