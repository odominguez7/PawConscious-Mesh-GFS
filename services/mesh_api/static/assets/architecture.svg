<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid meet" font-family="JetBrains Mono, ui-monospace, monospace" role="img" aria-label="PawConscious Mesh Architecture — five-agent multi-agent system on Google Cloud (ADK + Gemini + Cloud Run + A2A v0.3)">
  <defs>
    <style>
      .bg { fill: #F2EDE0; }
      .ink { fill: #1A1D1E; }
      .moss { fill: #13322B; }
      .amber { fill: #9C5E1A; }
      .linen { fill: #C8C2B6; }
      .paper { fill: #EAE3D2; }
      .display { font-family: Newsreader, Georgia, serif; font-weight: 400; }
      .mono-sm { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 500; }
      .mono-md { font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; }
      .label { font-size: 12px; letter-spacing: 0.06em; font-weight: 500; }
      .edge { stroke: #1A1D1E; stroke-width: 1.4; fill: none; }
      .edge-moss { stroke: #13322B; stroke-width: 1.6; fill: none; }
      .edge-amber { stroke: #9C5E1A; stroke-width: 1.6; fill: none; }
    </style>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1D1E"/>
    </marker>
    <marker id="arrow-moss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#13322B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" class="bg"/>

  <!-- Title block -->
  <g>
    <text x="60" y="50" class="display" font-size="36" fill="#1A1D1E">PawConscious — Agentic Compliance Protocol</text>
    <text x="60" y="78" class="mono-sm" fill="#13322B">Architecture · Google for Startups AI Agents Challenge · Track 3</text>
    <line x1="60" y1="100" x2="1340" y2="100" stroke="#C8C2B6" stroke-width="1"/>
  </g>

  <!-- Track 3 mandate band (top) -->
  <g transform="translate(60, 130)">
    <text class="mono-sm" fill="#13322B">Track 3 hard mandates · met</text>
    <g transform="translate(0, 18)">
      <rect x="0" y="0" width="290" height="42" class="paper" stroke="#13322B" stroke-width="1.4"/>
      <text x="14" y="18" class="mono-sm" fill="#13322B">✓ B2B Focus</text>
      <text x="14" y="34" class="label" fill="#1A1D1E">DTC pet brand → enterprise retailer/insurer</text>
    </g>
    <g transform="translate(310, 18)">
      <rect x="0" y="0" width="290" height="42" class="paper" stroke="#13322B" stroke-width="1.4"/>
      <text x="14" y="18" class="mono-sm" fill="#13322B">✓ Cloud-Native Runtime</text>
      <text x="14" y="34" class="label" fill="#1A1D1E">Cloud Run + Vertex AI Agent Engine</text>
    </g>
    <g transform="translate(620, 18)">
      <rect x="0" y="0" width="290" height="42" class="paper" stroke="#13322B" stroke-width="1.4"/>
      <text x="14" y="18" class="mono-sm" fill="#13322B">✓ Gemini Powered</text>
      <text x="14" y="34" class="label" fill="#1A1D1E">Gemini 2.5 Pro reasoning · 2.5 Flash routing</text>
    </g>
    <g transform="translate(930, 18)">
      <rect x="0" y="0" width="290" height="42" class="paper" stroke="#13322B" stroke-width="1.4"/>
      <text x="14" y="18" class="mono-sm" fill="#13322B">✓ A2A Interoperability</text>
      <text x="14" y="34" class="label" fill="#1A1D1E">A2A v0.3 public agent card + ShopperAgent</text>
    </g>
  </g>

  <!-- User / Brand input -->
  <g transform="translate(60, 240)">
    <rect x="0" y="0" width="240" height="68" class="bg" stroke="#1A1D1E" stroke-width="1.6"/>
    <text x="14" y="22" class="mono-sm" fill="#13322B">Brand owner</text>
    <text x="14" y="42" class="display" font-size="14" fill="#1A1D1E">POST /a2a/v1/tasks/send</text>
    <text x="14" y="58" class="label" fill="#1A1D1E">{ skill: verify_claim, product_url }</text>
  </g>
  <line x1="300" y1="274" x2="430" y2="274" class="edge" marker-end="url(#arrow-ink)"/>

  <!-- Vertex AI Agent Engine orchestrator -->
  <g transform="translate(430, 230)">
    <rect x="0" y="0" width="320" height="120" class="paper" stroke="#13322B" stroke-width="2"/>
    <text x="20" y="24" class="mono-md" fill="#13322B">Vertex AI Agent Engine</text>
    <text x="20" y="48" class="display" font-size="16" fill="#1A1D1E">Multi-agent orchestrator</text>
    <text x="20" y="68" class="label" fill="#1A1D1E">ADK 2.0 · ParallelAgent fan-out</text>
    <text x="20" y="84" class="label" fill="#1A1D1E">SequentialAgent merge + sign</text>
    <text x="20" y="100" class="label" fill="#9C5E1A">reasoningEngines/1255381144908595200</text>
  </g>

  <!-- 5 specialized agents -->
  <g transform="translate(810, 130)">
    <!-- agent 1 -->
    <g transform="translate(0, 0)">
      <line x1="-60" y1="44" x2="40" y2="44" class="edge-amber" marker-end="url(#arrow-moss)"/>
      <rect x="40" y="0" width="290" height="88" class="bg" stroke="#9C5E1A" stroke-width="1.6"/>
      <text x="56" y="22" class="mono-sm" fill="#9C5E1A">01 · Claim Extractor</text>
      <text x="56" y="44" class="display" font-size="14" fill="#1A1D1E">Pulls every health claim from PDP</text>
      <text x="56" y="62" class="label" fill="#1A1D1E">Tool: Firecrawl MCP</text>
      <text x="56" y="78" class="label" fill="#1A1D1E">Model: Gemini 2.5 Pro · temperature 0</text>
    </g>
    <!-- agent 2 -->
    <g transform="translate(0, 110)">
      <line x1="-60" y1="44" x2="40" y2="44" class="edge-amber" marker-end="url(#arrow-moss)"/>
      <rect x="40" y="0" width="290" height="88" class="bg" stroke="#9C5E1A" stroke-width="1.6"/>
      <text x="56" y="22" class="mono-sm" fill="#9C5E1A">02 · Evidence Grader</text>
      <text x="56" y="44" class="display" font-size="14" fill="#1A1D1E">Grades PubMed citations per claim</text>
      <text x="56" y="62" class="label" fill="#1A1D1E">Tool: BioMCP + AI2 Asta MCP</text>
      <text x="56" y="78" class="label" fill="#1A1D1E">Grounding: Vertex AI Search</text>
    </g>
    <!-- agent 3 -->
    <g transform="translate(0, 220)">
      <line x1="-60" y1="44" x2="40" y2="44" class="edge-amber" marker-end="url(#arrow-moss)"/>
      <rect x="40" y="0" width="290" height="88" class="bg" stroke="#9C5E1A" stroke-width="1.6"/>
      <text x="56" y="22" class="mono-sm" fill="#9C5E1A">03 · Vet Rubric</text>
      <text x="56" y="44" class="display" font-size="14" fill="#1A1D1E">5-criterion rubric scores each claim</text>
      <text x="56" y="62" class="label" fill="#1A1D1E">Tool: Vertex AI Search (vet corpus)</text>
      <text x="56" y="78" class="label" fill="#1A1D1E">Roadmap: real academic panel</text>
    </g>
    <!-- agent 4 -->
    <g transform="translate(0, 330)">
      <line x1="-60" y1="44" x2="40" y2="44" class="edge-amber" marker-end="url(#arrow-moss)"/>
      <rect x="40" y="0" width="290" height="88" class="bg" stroke="#9C5E1A" stroke-width="1.6"/>
      <text x="56" y="22" class="mono-sm" fill="#9C5E1A">04 · Compliance</text>
      <text x="56" y="44" class="display" font-size="14" fill="#1A1D1E">Maps claims to FTC §255.3 + AAFCO</text>
      <text x="56" y="62" class="label" fill="#1A1D1E">Tool: Vertex AI Search (regulator corpus)</text>
      <text x="56" y="78" class="label" fill="#1A1D1E">Outputs: ftc_section, violation_flag</text>
    </g>
    <!-- agent 5 -->
    <g transform="translate(0, 440)">
      <line x1="-60" y1="44" x2="40" y2="44" class="edge-amber" marker-end="url(#arrow-moss)"/>
      <rect x="40" y="0" width="290" height="88" class="bg" stroke="#9C5E1A" stroke-width="1.6"/>
      <text x="56" y="22" class="mono-sm" fill="#9C5E1A">05 · Auditor (Falsifier)</text>
      <text x="56" y="44" class="display" font-size="14" fill="#1A1D1E">Adversarial pass — catches hallucinations</text>
      <text x="56" y="62" class="label" fill="#1A1D1E">Tool: ADK Eval + direction falsifier</text>
      <text x="56" y="78" class="label" fill="#1A1D1E">Model: Gemini 2.5 Flash · temperature 0</text>
    </g>
  </g>

  <!-- Fan-out edges from orchestrator to agents -->
  <g>
    <line x1="750" y1="290" x2="810" y2="174" class="edge-amber" marker-end="url(#arrow-moss)"/>
    <line x1="750" y1="290" x2="810" y2="284" class="edge-amber" marker-end="url(#arrow-moss)"/>
    <line x1="750" y1="290" x2="810" y2="394" class="edge-amber" marker-end="url(#arrow-moss)"/>
    <line x1="750" y1="290" x2="810" y2="504" class="edge-amber" marker-end="url(#arrow-moss)"/>
    <line x1="750" y1="290" x2="810" y2="614" class="edge-amber" marker-end="url(#arrow-moss)"/>
  </g>

  <!-- Merge + Sign + Anchor -->
  <g transform="translate(430, 690)">
    <line x1="160" y1="-340" x2="160" y2="0" class="edge" stroke-dasharray="4 6"/>
    <rect x="0" y="0" width="320" height="92" class="paper" stroke="#13322B" stroke-width="2"/>
    <text x="20" y="24" class="mono-md" fill="#13322B">SequentialAgent · merge + sign</text>
    <text x="20" y="48" class="display" font-size="14" fill="#1A1D1E">PCEC v0.1 bundle · Ed25519</text>
    <text x="20" y="68" class="label" fill="#1A1D1E">bundle_hash sha256 · canonical JSON</text>
    <text x="20" y="84" class="label" fill="#9C5E1A">did:web:mesh-api-…run.app</text>
  </g>

  <!-- Transparency log -->
  <g transform="translate(810, 690)">
    <line x1="-60" y1="46" x2="40" y2="46" class="edge" marker-end="url(#arrow-ink)"/>
    <rect x="40" y="0" width="290" height="92" class="bg" stroke="#1A1D1E" stroke-width="1.6"/>
    <text x="56" y="24" class="mono-sm" fill="#13322B">Transparency log</text>
    <text x="56" y="48" class="display" font-size="14" fill="#1A1D1E">Firestore append-only chain</text>
    <text x="56" y="68" class="label" fill="#1A1D1E">chain_anchor = sha256(bundle_hash + prev)</text>
    <text x="56" y="84" class="label" fill="#9C5E1A">/pcec/v0/chain/head</text>
  </g>

  <!-- Response to brand -->
  <g transform="translate(60, 690)">
    <line x1="240" y1="46" x2="430" y2="46" class="edge" marker-end="url(#arrow-ink)" stroke-dasharray="6 4"/>
    <rect x="0" y="0" width="240" height="92" class="bg" stroke="#1A1D1E" stroke-width="1.6"/>
    <text x="14" y="24" class="mono-sm" fill="#13322B">Brand response</text>
    <text x="14" y="48" class="display" font-size="14" fill="#1A1D1E">GET /a2a/v1/tasks/get</text>
    <text x="14" y="68" class="label" fill="#1A1D1E">bundle_hash · signature · chain_anchor</text>
    <text x="14" y="84" class="label" fill="#1A1D1E">output: {claims, vet_scores, compliance, audit}</text>
  </g>

  <!-- ShopperAgent (external A2A caller) -->
  <g transform="translate(60, 420)">
    <rect x="0" y="0" width="240" height="92" class="bg" stroke="#9C5E1A" stroke-width="1.8"/>
    <text x="14" y="24" class="mono-sm" fill="#9C5E1A">External A2A consumer</text>
    <text x="14" y="48" class="display" font-size="14" fill="#1A1D1E">ShopperAgent (Cloud Run)</text>
    <text x="14" y="68" class="label" fill="#1A1D1E">Discovers via /.well-known/agent-card.json</text>
    <text x="14" y="84" class="label" fill="#1A1D1E">Calls verify_claim · ranks by trust score</text>
    <line x1="240" y1="46" x2="430" y2="280" class="edge-amber" stroke-dasharray="8 4" marker-end="url(#arrow-moss)"/>
    <text x="260" y="180" class="mono-sm" fill="#9C5E1A" font-size="10">A2A v0.3 round trip</text>
  </g>

  <!-- Footer / metadata -->
  <g transform="translate(60, 830)">
    <line x1="0" y1="0" x2="1280" y2="0" stroke="#C8C2B6"/>
    <text x="0" y="22" class="mono-sm" fill="#1A1D1E" opacity="0.7">MIT licensed · PCEC v0.1 spec CC-BY-4.0 · Built on Google Cloud · github.com/odominguez7/PawConscious-Mesh-GFS</text>
    <text x="0" y="42" class="mono-sm" fill="#13322B" opacity="0.7">PawConscious Mesh · Reference deployment for the Agentic Compliance Protocol</text>
  </g>
</svg>
